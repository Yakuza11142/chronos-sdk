name: Chronos Engine CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Native C Toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential gcc

    - name: Compile Chronos Ecosystem
      run: make

    - name: Execute Full Compiler & VM Pipeline
      run: ./chronos main.chronos
